# PortOne (구 아임포트) REST API 설정
# PortOne 관리자 콘솔(https://admin.portone.io) > 결제 연동 > API 키 관리에서 확인
#
# ★ 이 파일은 git에 커밋하지 마세요 (.gitignore에 추가 권장)
# ★ 값이 비어 있으면 자동으로 샌드박스 모드 (테스트/개발 환경용)
# ★ 프로덕션 배포 전 반드시 실제 키로 교체하세요

portone.imp-key=
portone.imp-secret=

# JWT 시크릿 키 (Base64 인코딩된 256bit 이상 고정 키)
# 미설정 시 서버 재시작마다 랜덤 키가 생성되어 기존 로그인 토큰이 무효화됨
# 아래 값은 로컬 개발용 기본값 — 프로덕션에서는 반드시 교체할 것
jwt.secret.key=dGlja2V0bGVnYWN5LWxvY2FsLWRldi1zZWNyZXQta2V5LTI1NmJpdA==

# Elasticsearch
elasticsearch.host=localhost
elasticsearch.port=9200

